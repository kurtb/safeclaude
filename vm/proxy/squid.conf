# devvm transparent SNI allowlist proxy — Squid peek-and-splice (NO MITM).
#
# Squid peeks at the TLS SNI, SPLICES (passes through, no decryption) sessions
# whose server-name is allowlisted, and terminates the rest. HTTP is allowed by
# Host header. The allowlist is DOMAIN names (from allowlist.conf), so CDN IP
# rotation is a non-issue.
#
# Enforced transparently: host nftables DNATs the VM's :80/:443 here (see
# lib/host-egress.sh), so a guest-root agent can't bypass it by ignoring proxy
# env vars. VERIFY ports/paths on the target Incus host.

# Bind to the bridge IP only (not 0.0.0.0) so only the VM subnet reaches it.
# @PROXY_IP@ is substituted by host-egress.sh (kept in sync with DEVVM_PROXY_IP).
http_port @PROXY_IP@:3129 intercept
# ssl-bump needs a cert param even when only splicing; it is never presented on a
# splice. install-host.sh generates /etc/squid/devvm-proxy.pem.
https_port @PROXY_IP@:3130 intercept ssl-bump \
  tls-cert=/etc/squid/devvm-proxy.pem generate-host-certificates=off

# Reject a forged Host header whose name/IP don't match (blocks the HTTP side of
# the --resolve bypass). The nft dest-IP set (host-egress.sh) is the primary pin.
host_verify_strict on

acl allowed_sni  ssl::server_name "/etc/squid/devvm-allowed-domains"
acl allowed_http dstdomain        "/etc/squid/devvm-allowed-domains"
acl step1 at_step SslBump1

ssl_bump peek step1
ssl_bump splice allowed_sni
ssl_bump terminate all

http_access allow allowed_http
http_access deny all

cache deny all   # policy gateway, not a cache
