# devvm transparent SNI allowlist proxy — Squid peek-and-splice (NO MITM).
#
# Squid peeks at the TLS SNI, SPLICES (passes through, no decryption) sessions
# whose server-name is allowlisted, and terminates the rest. HTTP is allowed by
# Host header. The allowlist is DOMAIN names (from allowlist.conf), so CDN IP
# rotation is a non-issue.
#
# Enforced transparently: host nftables DNATs the VM's :80/:443 here (see
# lib/host-egress.sh), so a guest-root agent can't bypass it by ignoring proxy
# env vars. VERIFY ports/paths on the target Incus host.
#
# Installed as a conf.d DROP-IN; Debian's stock /etc/squid/squid.conf is NOT
# modified. The stock :3128 explicit proxy therefore still exists, reachable FROM
# LOCALHOST ONLY (stock `allow localhost`; `allow localnet` is commented, and the
# nft input chain blocks the guest from :3128). That residual localhost-only open
# proxy grants nothing to the guest or the LAN and is closed in a follow-up (a
# dedicated Squid instance that retires the stock :3128).

# Bind to the bridge IP only (not 0.0.0.0) so only the VM subnet reaches it.
# @PROXY_IP@ is substituted by host-egress.sh (kept in sync with DEVVM_PROXY_IP).
# name= tags the listener so http_access can be scoped to it via `myportname`
# (NOT `localport`: on an intercept port Squid reports the ORIGINAL destination
# port — 443 — recovered via SO_ORIGINAL_DST, never the 3130 it listens on, so
# `localport 3130` never matches an intercepted connection).
http_port @PROXY_IP@:3129 intercept name=devvm_http
# ssl-bump needs a cert param even when only splicing; it is never presented on a
# splice. install-host.sh generates /etc/squid/devvm-proxy.pem.
https_port @PROXY_IP@:3130 intercept ssl-bump name=devvm_https \
  tls-cert=/etc/squid/devvm-proxy.pem generate-host-certificates=off

# Reject a forged Host header whose name/IP don't match (blocks the HTTP side of
# the --resolve bypass). The nft dest-IP set (host-egress.sh) is the primary pin.
host_verify_strict on

acl allowed_sni  ssl::server_name "/etc/squid/devvm-allowed-domains"
acl allowed_http dstdomain        "/etc/squid/devvm-allowed-domains"
acl step1 at_step SslBump1
acl CONNECT method CONNECT
# Our own intercept listeners, matched by the port's name= tag — used to SCOPE the
# allows below so they can never apply to any other Squid listener (e.g. the stock
# Debian :3128 explicit proxy). `myportname` is the listener's own identity and is
# reliable on intercept ports; `localport` is NOT (see the http_port note above).
acl int_http  myportname devvm_http
acl int_https myportname devvm_https

ssl_bump peek step1
ssl_bump splice allowed_sni
ssl_bump terminate all

# HTTP (:3129) is gated here by Host via dstdomain. HTTPS (:3130, intercept
# ssl-bump) arrives as a CONNECT to the dest *IP*, which dstdomain can't match
# (no hostname at this point), so the TLS CONNECT must be allowed through to
# ssl_bump — which IS the HTTPS gate: it SPLICES allowlisted SNI and TERMINATEs
# everything else. The nft dest-IP pin already restricted which IPs reach this
# port. Without this allow, the CONNECT is denied at step1 and Squid bumps a
# self-signed error cert that the guest rightly rejects ("self-signed certificate").
#
# Each allow is SCOPED to our own intercept listener via `myportname` (`localport`
# is unreliable on intercept ports — see the http_port note above). This is a
# conf.d drop-in, so Debian's stock `allow localhost` still precedes our rules and
# the stock :3128 stays reachable from localhost (documented limitation, follow-up
# closes it). `deny CONNECT !int_https` still confines CONNECT on OUR listeners to
# the intercept-HTTPS port so the drop-in itself adds no forwarding path.
http_access deny CONNECT !int_https
http_access allow allowed_http int_http
http_access allow CONNECT int_https
http_access deny all

cache deny all   # policy gateway, not a cache
