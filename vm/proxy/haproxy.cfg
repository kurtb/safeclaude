# devvm egress proxy — HAProxy, connecting BY NAME (no MITM, no decryption).
#
# The guest's :80/:443 traffic is DNATed here by host nftables (lib/host-egress.sh)
# whatever IP the guest aimed at. For each connection this proxy:
#   1. reads the server name   — the TLS SNI (:443) or the Host header (:80);
#   2. drops it unless that exact name is on the allowlist;
#   3. RESOLVES THE NAME ITSELF and connects there. The IP the guest chose is
#      never used.
#
# Consequences:
#   - Rotating/CDN addresses just work: there is no IP snapshot to go stale, and
#     nothing depends on the guest and the proxy getting the same DNS answer.
#   - `curl --resolve <allowed-name>:443:<any-ip>` cannot steer the connection:
#     it reaches the real <allowed-name>, or nothing.
#   - A name that resolves to a private/loopback/link-local (cloud metadata)
#     address is refused (the BOGON list below), so an allowlisted name can't be
#     used to reach the host or the LAN.
#   - TLS is passed through untouched; the guest sees the real certificate.
#
# This is a DEDICATED instance (devvm-proxy.service) with its own config; the
# distro's haproxy.service and its /etc/haproxy/haproxy.cfg are not touched.
# @PROXY_IP@ and @DOMAINS@ are substituted by host-egress.sh.

global
  log stdout format raw local0 info
  user haproxy
  group haproxy
  maxconn 4096

defaults
  log global
  timeout connect 10s
  timeout client  1h      # long-lived streams (agent sessions, git, websockets)
  timeout server  1h
  timeout tunnel  1h
  timeout http-request 15s

# The proxy's own resolver: whatever the HOST resolves through. Only names that
# already passed the allowlist are ever looked up.
resolvers hostdns
  parse-resolv-conf
  accepted_payload_size 4096
  resolve_retries 3
  timeout resolve 2s
  timeout retry   1s
  hold valid 10s
  hold nx    5s
  hold other 5s

# ── HTTPS: pass-through by SNI ───────────────────────────────────────────────
frontend devvm_https
  mode tcp
  bind @PROXY_IP@:3130
  log-format "tls  %ci sni=%[var(sess.name)] -> %si:%sp %ts bytes=%B"

  # Wait (up to 5s) for the ClientHello; anything that isn't one is dropped.
  # NOTE: no `accept` rule anywhere in this block — `accept` ends evaluation
  # and would skip every check below it.
  tcp-request inspect-delay 5s
  tcp-request content reject unless { req.ssl_hello_type 1 }
  tcp-request content set-var(sess.name) req.ssl_sni,lower
  tcp-request content reject unless { var(sess.name) -m str -f @DOMAINS@ }

  tcp-request content do-resolve(sess.addr,hostdns,ipv4) var(sess.name)
  tcp-request content reject unless { var(sess.addr) -m found }
  # BOGON list — keep identical to the one in devvm_http below.
  tcp-request content reject if { var(sess.addr) -m ip 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/3 }

  tcp-request content set-dst var(sess.addr)
  tcp-request content set-dst-port int(443)
  default_backend devvm_out_tcp

# ── HTTP: by Host header (apt mirrors and the like) ──────────────────────────
frontend devvm_http
  mode http
  bind @PROXY_IP@:3129
  log-format "http %ci host=%[var(txn.name)] -> %si:%sp %ST bytes=%B %{+Q}r"

  http-request deny deny_status 405 if METH_CONNECT
  http-request set-var(txn.name) req.hdr(host),field(1,:),lower
  http-request deny deny_status 403 unless { var(txn.name) -m str -f @DOMAINS@ }

  http-request do-resolve(txn.addr,hostdns,ipv4) var(txn.name)
  http-request deny deny_status 502 unless { var(txn.addr) -m found }
  # BOGON list — keep identical to the one in devvm_https above.
  http-request deny deny_status 403 if { var(txn.addr) -m ip 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/3 }

  http-request set-dst var(txn.addr)
  http-request set-dst-port int(80)
  default_backend devvm_out_http

# `0.0.0.0:0` = "connect to the destination set above". Nothing else can reach
# these backends: both frontends reject before setting a destination.
backend devvm_out_tcp
  mode tcp
  server byname 0.0.0.0:0

backend devvm_out_http
  mode http
  # One upstream connection per request: a kept-alive client connection may
  # name a different allowed Host on its next request, and must not be handed a
  # connection that was opened to the previous one.
  http-reuse never
  option http-server-close
  server byname 0.0.0.0:0
