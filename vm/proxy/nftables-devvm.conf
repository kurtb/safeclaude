# Installed as /etc/systemd/system/nftables.service.d/devvm.conf.
# nftables.service flushes the whole ruleset on start, reload and stop, which
# deletes the devvm tables. Put the last applied guest firewall back each time.
# "+" runs it outside the unit's ProtectSystem sandbox, like devvm-firewall.service.
[Service]
ExecStartPost=+/usr/local/lib/devvm/host-firewall.sh --restore
ExecReload=+/usr/local/lib/devvm/host-firewall.sh --restore
ExecStopPost=+/usr/local/lib/devvm/host-firewall.sh --restore
