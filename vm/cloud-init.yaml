#cloud-config
# Shared guest provisioning — identical across all OS drivers.
#
# Runs on first boot UNDER the egress policy (drivers apply it before boot), so
# every host this touches must be allowlisted, and HTTPS flows through the
# transparent SNI proxy. CLONE-ONLY: no host mount; the driver git-clones the
# project into /root/workspace after boot.
package_update: true
packages: [curl, git, jq, gh]
runcmd:
  # Docker — native in a VM (no DinD, no host-socket mount). NOTE: get.docker.com
  # is an unpinned root installer (upstream provides no pinned URL); the egress
  # allowlist is the mitigation. TODO: pin to a packaged docker-ce version.
  - [ bash, -lc, "curl -fsSL https://get.docker.com | sh" ]
  # Claude Code — substrate-agnostic; same installer as the container image.
  # NOTE: `|| true` means a failed install is non-fatal to first boot (re-runs
  # pick it up); check `claude --version` after boot.
  - [ bash, -lc, "curl -fsSL https://downloads.claude.ai/install.sh | bash || true" ]
  - [ bash, -lc, "install -d -m 0755 /root/workspace" ]
  # VS Code Remote-SSH attaches here; sshd is already in the cloud image.
# TODO: port the rest of the Dockerfile toolchain (node/fnm, bun, codex, gstack,
# yolo-* wrappers, safeclaude-doctor) and pin versions; share steps with the
# Dockerfile so the VM and image toolchains don't drift.
