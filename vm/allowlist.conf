# devvm egress allowlist — canonical, shared across all OS drivers.
#
# One host per line; '#' comments and blank lines ignored. Prefix a host with
# 'cidr:' to widen its resolved IPv4 to a /24 (for CDN/anycast rotation).
# GitHub ranges (api.github.com/meta) and Tailscale DERP IPs are fetched
# dynamically by lib/resolve-allowlist.sh, not listed here.
#
# TODO: make the container's init-firewall.sh read this same file (drift).

# Anthropic / Claude Code
api.anthropic.com
downloads.claude.ai
claude.ai
platform.claude.com
# claude.ai connectors (remote MCP: Linear, Claude Docs, Gmail, …) all go via
# this one proxy host. Posture: any connector on the logged-in account is
# reachable from the guest.
mcp-proxy.anthropic.com
statsig.com
sentry.io

