# Kubernetes + Helm
# registry.k8s.io serves layers from cdn.registry.k8s.io but redirects
# manifests to a REGIONAL host (<region>-docker.pkg.dev, picked by where you
# are), which can't be listed here: add yours with `devvm allow`.
dl.k8s.io
registry.k8s.io
cdn.registry.k8s.io
cidr:get.helm.sh

# Istio
istio-release.storage.googleapis.com

# Container registries + Docker install (review: docker.io is NOT the registry
# host; pulls need registry-1/auth, and the installer needs get.docker.com)
# Image layers come from blob CDNs, not the registry host itself.
ghcr.io
quay.io
cdn.quay.io
cdn01.quay.io
cdn02.quay.io
cdn03.quay.io
registry-1.docker.io
auth.docker.io
production.cloudflare.docker.com
production.cloudfront.docker.com
get.docker.com
download.docker.com
