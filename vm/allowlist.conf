# devvm egress allowlist — canonical, shared across all OS drivers.
#
# One EXACT host name per line; '#' comment lines and blank lines are ignored.
# No inline comments, wildcards or IPs: each line is matched verbatim by the
# proxy, and host-egress.sh refuses to apply a list with anything else in it.
#
# Names are all that is configured. The proxy looks the address up itself on
# every connection, so rotating CDN addresses need nothing special here.

# Anthropic / Claude Code
api.anthropic.com
downloads.claude.ai
claude.ai
platform.claude.com
# claude.ai connectors (remote MCP: Linear, Claude Docs, Gmail, …) all go via
# this one proxy host. Posture: any connector on the logged-in account is
# reachable from the guest.
mcp-proxy.anthropic.com
statsig.com
sentry.io

# OpenAI / Codex CLI
api.openai.com
chatgpt.com
auth.openai.com

# Google / Gemini CLI + gcloud
generativelanguage.googleapis.com
cloudcode-pa.googleapis.com
oauth2.googleapis.com
accounts.google.com
dl.google.com
packages.cloud.google.com

# Cursor CLI
cursor.com
api2.cursor.sh
downloads.cursor.com

# Langfuse
langfuse.com
cloud.langfuse.com
us.cloud.langfuse.com

# Package registries
registry.npmjs.org
pypi.org
files.pythonhosted.org
bun.sh
nodejs.org

# mise (tool version manager, installed by guest-tools.sh). mise-versions is
# its version index (and where it finds prebuilt Pythons); the sigstore host
# serves the trust root it uses to verify GitHub artifact attestations before
# installing a tool. The tools themselves come from hosts already listed
# (GitHub releases, nodejs.org, dl.google.com, ...); a tool hosted elsewhere
# needs its own `devvm allow`.
mise-versions.jdx.dev
tuf-repo-cdn.sigstore.dev

# GitHub auxiliary. release-assets is where every release download redirects
# to (tool installers, `gh release download`); pkg-containers serves ghcr.io
# image layers.
objects.githubusercontent.com
release-assets.githubusercontent.com
pkg-containers.githubusercontent.com
codeload.github.com
raw.githubusercontent.com

# Pulumi
get.pulumi.com
api.pulumi.com

# Ubuntu / apt
archive.ubuntu.com
security.ubuntu.com
ports.ubuntu.com

# GitHub web + API + project pages
github.com
api.github.com
bitnami-labs.github.io

# Tailscale: package repo and control plane only. DERP relays
# (derpN.tailscale.com) are not listed, and were never reachable here: the old
# proxy required a listed name as well as a listed IP.
pkgs.tailscale.com
controlplane.tailscale.com
login.tailscale.com

# Kubernetes + Helm
# registry.k8s.io serves layers from cdn.registry.k8s.io but redirects
# manifests to a REGIONAL host (<region>-docker.pkg.dev, picked by where you
# are), which can't be listed here: add yours with `devvm allow`.
dl.k8s.io
registry.k8s.io
cdn.registry.k8s.io
get.helm.sh

# Istio
istio-release.storage.googleapis.com

# Container registries + Docker install (review: docker.io is NOT the registry
# host; pulls need registry-1/auth, and the installer needs get.docker.com)
# Image layers come from blob CDNs, not the registry host itself: quay.io ->
# cdn*.quay.io; Docker Hub -> production.cloudfront.docker.com (observed) or
# production.cloudflare.docker.com.
ghcr.io
quay.io
cdn.quay.io
cdn01.quay.io
cdn02.quay.io
cdn03.quay.io
registry-1.docker.io
auth.docker.io
production.cloudflare.docker.com
production.cloudfront.docker.com
get.docker.com
download.docker.com
