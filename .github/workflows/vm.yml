name: VM checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck haproxy jq nftables dnsmasq-base bind9-dnsutils
      - run: vm/test/run.sh --rig

  incus:
    strategy:
      fail-fast: false
      matrix:
        guest: [container, vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check hosted KVM
        if: matrix.guest == 'vm'
        run: sudo test -c /dev/kvm && ls -l /dev/kvm
      - name: Install current stable Incus and devvm
        run: |
          # GitHub uses a mirror+file URI. python-apt cannot report its site
          # for package provenance. Select the runner's signed Ubuntu mirror.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          # The hosted image grants the runner write access to local tool dirs.
          # Give the privileged installer dedicated root-owned parent paths.
          sudo chown root:root /usr/local /usr/local/lib /usr/local/bin
          sudo chmod go-w /usr/local /usr/local/lib /usr/local/bin
          git archive --format=tar.gz --prefix=devvm/ HEAD:vm | tar -xz -C "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/devvm/install-host.sh"
          sudo "$RUNNER_TEMP/devvm/install-host.sh" --check
          sudo incus admin init --minimal
      - name: Exercise installed CLI and guest
        env:
          GUEST: ${{ matrix.guest }}
          DEVVM_TEST_GUEST_TOOLS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: sudo --preserve-env=DEVVM_TEST_GUEST_TOOLS vm/test/incus-integration.sh "$GUEST"
