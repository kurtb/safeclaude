name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required to POST review comments (was read → denied)
      issues: write          # top-level PR comments go through the issues API
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post ONE consolidated review as a single top-level PR comment.
          # We post explicitly via `gh pr comment` rather than relying on the
          # action's auto-post (which does nothing in automation mode) — that
          # silent no-op is exactly the bug this fixes.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}. Inspect the diff with
            `gh pr diff ${{ github.event.pull_request.number }}` and read
            surrounding files for context as needed.

            Focus on real correctness and security bugs and risky changes; call
            out smaller reuse/simplification/efficiency cleanups briefly. For this
            repo, flag any change to the firewall egress allowlist/surface, since
            that is a security-posture change.

            Then post your review as exactly ONE top-level PR comment via:
              gh pr comment ${{ github.event.pull_request.number }} --body "<review>"
            Organize it by severity (Blocking / Should-fix / Nits) with file:line
            references. If nothing needs changing, post a brief comment saying the
            PR looks good. Post exactly one comment.
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

