name: Release

# One-click release automation. From the Actions tab, "Run workflow" and pick a
# bump (patch/minor/major) — or type an explicit version. This computes the next
# SemVer tag from the latest existing one, creates the git tag + a GitHub Release
# (with generated notes), then triggers publish.yml to build & push the
# versioned image (:X.Y.Z, :X.Y, :X).
#
# First release: pick `minor` to get v0.1.0 (from v0.0.0).
#
# Note: the tag is created with the built-in GITHUB_TOKEN, which does NOT trigger
# publish.yml's `on: push` tag event, so we dispatch publish.yml explicitly on
# the new tag (needs `actions: write`).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored if 'version' is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version, e.g. v1.0.0 (overrides bump)
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the tag + GitHub Release
      actions: write    # dispatch publish.yml on the new tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            next="$OVERRIDE"
            case "$next" in v*) ;; *) next="v$next" ;; esac
          else
            latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)"
            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi
          if ! printf '%s' "$next" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing to release non-SemVer version: $next" >&2
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          if gh release view "$NEXT" >/dev/null 2>&1; then
            echo "Release $NEXT already exists" >&2
            exit 1
          fi
          gh release create "$NEXT" \
            --target "$GITHUB_SHA" \
            --title "$NEXT" \
            --generate-notes

      - name: Trigger image publish for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref "$NEXT"
          echo "Dispatched publish.yml on $NEXT — watch the Actions tab for the image build."
