name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored when an explicit version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version, e.g. v1.0.0
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and publish the VM release
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n $OVERRIDE ]]; then
            next="v${OVERRIDE#v}"
          else
            latest=$(git for-each-ref --sort=-version:refname --count=1 --format='%(refname:short)' 'refs/tags/v*.*.*')
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) exit 1 ;;
            esac
            next="v$major.$minor.$patch"
          fi
          [[ $next =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid version: $next"; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$next"; then
            echo "Tag already exists: $next"; exit 1
          fi

          ci/package-vm.sh "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum -c devvm.tar.gz.sha256
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$next" --generate-notes \
            --notes "Install the Linux/Incus VM runner from the attached bundle. See the [installation and Docker migration guide](https://github.com/$GITHUB_REPOSITORY/blob/$next/README.md)." \
            devvm.tar.gz devvm.tar.gz.sha256
